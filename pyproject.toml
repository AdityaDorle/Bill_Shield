[project]
name = "billshield"
version = "0.1.0"
description = "Bill verification and grounded dispute message drafting"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "pymupdf>=1.25,<2",
    "Pillow>=11,<13",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app:app"
